<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TJA Zip Converter</title>
<style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--line:#d8d5cc;--accent:#d9381e;--mute:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#eee;--card:#26262a;--line:#3a3a40;--accent:#ff6a4d;--mute:#999}}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#eee;--card:#26262a;--line:#3a3a40;--accent:#ff6a4d;--mute:#999}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
#drop{border:2px dashed var(--line);background:var(--card);border-radius:12px;padding:40px 16px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--accent)}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}
#result{display:none;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
ul{margin:8px 0;padding-left:20px;max-height:240px;overflow:auto;font-size:.85rem;word-break:break-all}
.mute{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>TJA Zip Converter</h1>
<p class="sub">zip内の画像を削除し、.tja の COURSE を Dan に統一します(ブラウザ内で処理・外部送信なし)。</p>
<div id="drop">zipをここにドロップ、またはクリックして選択<input id="file" type="file" accept=".zip" hidden></div>
<div id="result">
<div id="summary"></div>
<ul id="log"></ul>
<a id="dl" class="btn" href="#">変換したzipをダウンロード</a>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const IMG=/\.(png|jpe?g|gif|bmp|webp|svg|ico|tiff?|avif|heic|heif)$/i;
const drop=document.getElementById('drop'),input=document.getElementById('file');
drop.onclick=()=>input.click();
input.onchange=()=>input.files[0]&&run(input.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');e.dataTransfer.files[0]&&run(e.dataTransfer.files[0])};

function decodeName(bytes){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
  catch(e){try{return new TextDecoder('shift_jis').decode(bytes)}catch(_){return new TextDecoder().decode(bytes)}}
}
// バイト列を1文字=1バイトで扱い、文字コード(UTF-8/Shift_JIS)を壊さず編集する
function fixTja(u8){
  let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  const nl=s.includes('\r\n')?'\r\n':(s.includes('\r')&&!s.includes('\n')?'\r':'\n');
  const lines=s.split(/\r\n|\n|\r/);
  let replaced=0;
  for(let i=0;i<lines.length;i++){
    const t=lines[i].replace(/^\xEF\xBB\xBF/,'');
    if(/^\s*COURSE\s*:/i.test(t)){
      const bom=lines[i].startsWith('\xEF\xBB\xBF')?'\xEF\xBB\xBF':'';
      lines[i]=bom+'COURSE:Dan';replaced++;
    }
  }
  let added=false;
  if(!replaced){
    const strip=l=>l.replace(/^\xEF\xBB\xBF/,'');
    const sm=lines.findIndex(l=>/^\s*SCOREMODE\s*:/i.test(strip(l)));
    let idx;
    if(sm>=0)idx=sm+1;
    else{
      idx=lines.findIndex(l=>/^\s*#START/i.test(strip(l)));
      if(idx<0){idx=lines.length;if(lines[idx-1]==='')idx--;}
    }
    lines.splice(idx,0,'COURSE:Dan');added=true;
  }
  const out=lines.join(nl);
  const r=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)r[i]=out.charCodeAt(i);
  return{data:r,replaced,added};
}

async function run(file){
  const log=document.getElementById('log');log.innerHTML='';
  const res=document.getElementById('result');res.style.display='block';
  const sum=document.getElementById('summary');sum.textContent='処理中…';
  try{
    const zip=await JSZip.loadAsync(file,{decodeFileName:decodeName});
    let removed=0,tja=0;
    const names=Object.keys(zip.files);
    for(const name of names){
      const f=zip.files[name];if(f.dir)continue;
      const li=document.createElement('li');
      if(IMG.test(name)){zip.remove(name);removed++;li.textContent='🗑 削除: '+name;log.appendChild(li);continue}
      if(/\.tja$/i.test(name)){
        const r=fixTja(await f.async('uint8array'));
        zip.file(name,r.data,{date:f.date});tja++;
        li.textContent=(r.added?'＋ 追加: ':'✎ 変更('+r.replaced+'件): ')+name;log.appendChild(li);
      }
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    const a=document.getElementById('dl');
    if(a.dataset.u)URL.revokeObjectURL(a.dataset.u);
    a.dataset.u=a.href=URL.createObjectURL(blob);
    a.download=file.name.replace(/\.zip$/i,'')+'_converted.zip';
    sum.innerHTML='画像 <b>'+removed+'</b> 件を削除、tja <b>'+tja+'</b> 件を処理しました。';
    if(!tja)sum.innerHTML+='<br><span class="mute">.tja ファイルは見つかりませんでした。</span>';
  }catch(e){sum.textContent='zipを読み込めませんでした: '+e.message}
}
</script>
</body>
</html>
